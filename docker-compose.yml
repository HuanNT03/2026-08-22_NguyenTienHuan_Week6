name: soc_sentinel_project

services:
  juice-shop:
    image: sentinel/juice-shop:v20.1.1
    pull_policy: build
    build:
      context: ./target-app/juice-shop
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${JUICE_SHOP_PORT:-3000}:3000"
    networks:
      - security
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3000/',
          response => process.exit(response.statusCode >= 200 && response.statusCode < 400 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  codeql-scan:
    profiles: ["scan"]
    build:
      context: ./docker/codeql
      args:
        CODEQL_VERSION: ${CODEQL_VERSION:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /workspace
    volumes:
      - ./target-app/juice-shop:/workspace/target-app/juice-shop:ro
      - ./configs/codeql:/workspace/configs/codeql:ro
      - ./reports/raw:/workspace/reports/raw:rw
    command:
      - /bin/bash
      - -euo
      - pipefail
      - -c
      - |
        codeql database create /tmp/codeql-db --language=javascript-typescript --source-root=target-app/juice-shop --codescanning-config=/workspace/configs/codeql/code-scanning.yml
        codeql database analyze /tmp/codeql-db javascript-security-extended.qls --ram=3000 --format=sarif-latest --sarif-add-query-help --sarif-add-snippets --output=reports/raw/codeql.sarif

  sqlmap-scan:
    profiles: ["scan"]
    image: ${SQLMAP_IMAGE:-sentinel/sqlmap:1.10.7}
    build:
      context: ./docker/sqlmap
      args:
        SQLMAP_VERSION: ${SQLMAP_VERSION:-}
        SQLMAP_SHA256: ${SQLMAP_SHA256:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /workspace
    volumes:
      - ./reports/raw:/workspace/reports/raw:rw
    networks:
      - security
    entrypoint:
      - sqlmap

  sentinel-ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: sentinel-ui
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - SEMGREP_APP_TOKEN=${SEMGREP_APP_TOKEN:-}
      - JUICE_SHOP_PORT=${JUICE_SHOP_PORT:-3000}
      - COMPOSE_PROJECT_NAME=soc_sentinel_project
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH:-${PWD}}
    networks:
      - security

networks:
  security:
    name: sentinel-security

