services:
  juice-shop:
    image: sentinel/juice-shop:v20.1.1
    build:
      context: ./target-app/juice-shop
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${JUICE_SHOP_PORT:-3000}:3000"
    networks:
      - security
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3000/',
          response => process.exit(response.statusCode >= 200 && response.statusCode < 400 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  codeql-scan:
    profiles: ["scan"]
    build:
      context: ./docker/codeql
      args:
        CODEQL_VERSION: ${CODEQL_VERSION:-}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /workspace
    volumes:
      - ./target-app/juice-shop:/workspace/target-app/juice-shop:ro
      - ./configs/codeql:/workspace/configs/codeql:ro
      - ./reports/raw:/workspace/reports/raw:rw
    command:
      - /bin/bash
      - -euo
      - pipefail
      - -c
      - |
        codeql database create /tmp/codeql-db --language=javascript-typescript --source-root=target-app/juice-shop --codescanning-config=/workspace/configs/codeql/code-scanning.yml
        codeql database analyze /tmp/codeql-db javascript-security-extended.qls --ram=3000 --format=sarif-latest --sarif-add-query-help --output=reports/raw/codeql.sarif

networks:
  security:
    name: sentinel-security
