name: Project Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Sentinel
        uses: actions/checkout@v4
      - name: Check prerequisites
        run: make doctor
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python development dependencies
        run: make install
      - name: Run repository quality checks
        run: make quality

  knowledge-base:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Sentinel
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install knowledge-base dependencies
        run: make install
      - name: Validate knowledge base
        run: make kb-validate
      - name: Build knowledge base
        run: make kb-build
      - name: Run knowledge-base tests
        run: make kb-test
      - name: Lint retrieval code
        run: make kb-lint
      - name: Verify generated knowledge documents are committed
        run: |
          git diff --exit-code -- \
            knowledge-base/processed/documents.jsonl \
            knowledge-base/processed/manifest.json

  sast:
    needs: quality
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/sast-scan.yml
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  dast:
    needs: quality
    uses: ./.github/workflows/dast-scan.yml


  normalize:
    needs: [sast, dast]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Sentinel
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install normalizer
        run: python -m pip install .
      - name: Remove checked-in and stale reports
        run: make clean-reports
      - name: Download raw scanner artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-raw-${{ github.run_id }}'
          path: reports/raw
          merge-multiple: true
      - name: Normalize scanner findings
        run: make normalize
      - name: Upload unified findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalized-findings-${{ github.run_id }}
          path: |
            reports/normalized/unified-findings.jsonl
            reports/normalized/normalization-summary.json
          retention-days: 14
          if-no-files-found: warn
