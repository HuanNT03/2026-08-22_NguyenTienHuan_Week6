name: Semgrep SAST

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Sentinel
        uses: actions/checkout@v4
      - name: Check prerequisites
        run: make doctor
      - name: Set up pinned target
        run: make setup-target
      - name: Run Semgrep
        run: make sast
      - name: Validate Semgrep report
        if: always()
        run: ./scripts/validate-reports.sh semgrep
      - name: Upload raw Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-raw-${{ github.run_id }}
          path: reports/raw/semgrep.json
          retention-days: 14
          if-no-files-found: warn
