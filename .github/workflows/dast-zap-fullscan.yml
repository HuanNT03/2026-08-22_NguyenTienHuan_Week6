name: ZAP Full Scan DAST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-fullscan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out Sentinel
        uses: actions/checkout@v4
      - name: Check prerequisites
        run: make doctor
      - name: Set up pinned target
        run: make setup-target
      - name: Build Juice Shop
        run: make build
      - name: Start Juice Shop
        run: make up
      - name: Wait for HTTP readiness
        run: make wait
      - name: Run host smoke test
        run: make smoke
      - name: Run ZAP Full Scan with Client Spider
        run: make dast-zap-fullscan
        env:
          SENTINEL_PIPELINE_RUN_ID: github_${{ github.run_id }}
      - name: Validate ZAP report
        if: success()
        run: ./scripts/validate-reports.sh zap
      - name: Capture Compose logs on failure
        if: failure()
        run: |
          mkdir -p logs
          docker compose logs --no-color juice-shop > logs/juice-shop-fullscan.log 2>&1 || true
      - name: Upload raw ZAP Full Scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-fullscan-raw-${{ github.run_id }}
          path: |
            reports/raw/zap.json
            reports/raw/zap.meta.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zap-fullscan-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop Compose resources
        if: always()
        run: make down
