[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-normalizers"
version = "1.0.0"
description = "Unified security scanner findings normalizer for Project Sentinel"
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
