id: example-missing-function-level-authorization
title: Missing Function-Level Authorization
aliases:
- Missing Function Authorization
- Broken Function Level Authorization
- BFLA
description: An administrative API endpoint relies only on client-side hiding and
  lacks server-side role checks.
root_cause:
- Access controls are enforced in UI only
- Privileged endpoints do not verify caller roles
vulnerable_example: 'app.delete(''/api/users/:id'', deleteUser);

  '
safe_example: 'app.delete(''/api/users/:id'', requireAuthentication, requireRole(''admin''),
  deleteUser);

  '
impact:
- Administrative privilege escalation
- Unauthorized bulk operations
remediation:
- Enforce role checks on every administrative handler
- Adopt declarative route-level policies
identifiers:
  cwe:
  - CWE-862
  owasp:
  - A01:2025
  semgrep:
  - javascript.express.security.audit.express-check-csurf-middleware-usage
  zap:
  - '40012'
tags:
- authorization
- privilege-escalation
- api
- access-control
detectability:
  sast: medium
  dast: medium
  manual: high
