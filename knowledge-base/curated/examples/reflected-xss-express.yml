id: example-reflected-xss-express
title: Reflected XSS in Express
aliases: [Reflected XSS, Non-Persistent XSS, CWE-79]
description: A request parameter is reflected into HTML without context-aware output encoding.
root_cause: [Untrusted input is inserted into an HTML response, Output encoding is missing]
vulnerable_example: |
  app.get('/search', (req, res) => res.send(`<p>${req.query.q}</p>`));
safe_example: |
  app.get('/search', (req, res) => res.render('search', { q: req.query.q }));
impact: [Session theft, Account actions in the victim browser]
remediation: [Use auto-escaping templates, Apply context-aware output encoding, Deploy a restrictive CSP]
identifiers:
  cwe: [CWE-79]
  owasp: [A05:2025]
tags: [xss, reflected, javascript, express]
detectability: {sast: high, dast: high, manual: high}
